name: Build APHRODITE Eosphoros INTERNAL EA map V2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aphrodite-internal-map-v2
  cancel-in-progress: false

jobs:
  build-aphrodite-internal-map:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout published site
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install map tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow rasterio
      - name: Download USGS Magellan C3-MDIR global image
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 \
            -o Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif \
            "https://planetarymaps.usgs.gov/mosaic/Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif"
          test -s Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif
          ls -lh Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif
      - name: Build tiles in APHRODITE internal H0 coordinates (G only)
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/build_aphrodite_tiles.py <<'PY'
          #!/usr/bin/env python3
          # -*- coding: utf-8 -*-
          """Magellan imagery -> APHRODITE LOCAL H0 tile pyramid, visual-only.

          No Venus/Earth SI units or physical Magellan beacons enter the G production
          core. The native 0E image line is *visually assigned* to the transferred
          Delphi meridian. The temple's computed nonzero longitude relative to that
          meridian then becomes the raster rotation; H0=0 is the transferred temple.
          This image registration does not establish an independent physical longitude.
          """
          from __future__ import annotations
          import argparse, hashlib, json, math, shutil
          from pathlib import Path
          import numpy as np
          import rasterio
          from rasterio.enums import Resampling
          from rasterio.windows import Window
          from PIL import Image

          ROOT_NAME = 'aphrodite_ea_map'
          CORE_ID = 'APHRODITE_EOSPHOROS_G_ONLY_V1_20260923'
          FRAME = 'APHRODITE_LOCAL_OMPHALOS_H0'
          TILE = 256
          C3_URL = 'https://planetarymaps.usgs.gov/mosaic/Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif'
          EXPECTED_OFFSET = 0.3746419723351068 # check-only, from frozen Python core, NOT input

          def simpson_unit(f, b, n=4096):
              h=b/n
              return h/3*(f(0.0)+f(b)+4*sum(f((2*i-1)*h) for i in range(1,n//2+1))
                          +2*sum(f(2*i*h) for i in range(1,n//2)))

          def transferred_omphalos_G():
              """Same input/geometry as frozen Python/JS; ONLY internal G units."""
              f=0.003352819468541
              e2=f*(2-f)
              rho=lambda p:(1-e2)/(1-e2*math.sin(p)**2)**1.5
              a_G=799/simpson_unit(rho,math.pi/2)
              phi_E=math.radians(37.891833)
              m_G=a_G*simpson_unit(rho,phi_E)
              p_G=a_G/math.sqrt(1-e2*math.sin(phi_E)**2)*math.cos(phi_E)*math.radians(22.875416-22.501166)
              radius_G=1598/math.pi
              lat=math.degrees(m_G/radius_G)
              temporary_offset=math.degrees(p_G/(radius_G*math.cos(math.radians(lat))))
              if abs(temporary_offset-EXPECTED_OFFSET)>2e-10:
                  raise RuntimeError('FAIL: independent reference transfer disagrees with frozen G core')
              return {'earth_meridian_G':m_G,'earth_parallel_G':p_G,'venus_omphalos_lat_deg':lat,
                      'temporary_delphi_to_temple_deg':temporary_offset,
                      'local_omphalos_longitude_deg':0.0,'local_omphalos_H':0}

          def checksum(p:Path):
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1<<20),b''): h.update(b)
              return h.hexdigest()

          def read_chunk(src, sx, sy, sw, sh, dstw, tile_size):
              if dstw<=0: return None
              # Natural periodic origin is at source x=0. Never let rasterio zero-fill
              # across x=source_width: split window at the source seam.
              a=src.read(1,window=Window(sx,sy,sw,sh),out_shape=(tile_size,dstw),
                         masked=True,resampling=Resampling.bilinear)
              return Image.fromarray(np.asarray(a.filled(0), dtype=np.uint8),mode='L')

          def render_tile(src,x,y,nx,ny,offset,tile_size):
              width=src.width
              sample_w=width/nx
              sample_h=src.height/ny
              sx=((x/nx)+offset/360)*width %width
              sy=y*sample_h
              if sx+sample_w <= width+1e-9:
                  return read_chunk(src,sx,sy,min(sample_w,width-sx),sample_h,tile_size,tile_size)
              # Rare single source-image seam. Both parts get their own source windows,
              # positioned according to *fractional source coverage*.
              first_w=width-sx
              second_w=sample_w-first_w
              first_px=int(round(tile_size*first_w/sample_w))
              first_px=max(1,min(tile_size-1,first_px))
              out=Image.new('L',(tile_size,tile_size),0)
              with read_chunk(src,sx,sy,first_w,sample_h,first_px,tile_size) as first:
                  out.paste(first,(0,0))
              with read_chunk(src,0,sy,second_w,sample_h,tile_size-first_px,tile_size) as second:
                  out.paste(second,(first_px,0))
              return out

          def build(src_path, root, max_z=5, synthetic=False):
              if not 0<=max_z<=5: raise ValueError('zoom range must be 0..5')
              geometry=transferred_omphalos_G()
              offset=geometry['temporary_delphi_to_temple_deg']
              if root.exists(): shutil.rmtree(root)
              tiles=root/'tiles'
              tiles.mkdir(parents=True)
              with rasterio.open(src_path) as src:
                  if src.count!=1 or src.dtypes[0]!='uint8':
                      raise RuntimeError('Expected one grayscale uint8 Magellan band')
                  if not synthetic and (src.width,src.height)!=(18775,9388):
                      raise RuntimeError(f'Unexpected C3-MDIR image dimensions: {(src.width,src.height)}')
                  if not(src.transform.a>0 and src.transform.e<0):
                      raise RuntimeError('Expected east-increasing, north-up source imagery')
                  width,height=src.width,src.height
                  nx,ny=2**(max_z+1),2**max_z
                  for x in range(nx):
                      col=tiles/str(max_z)/str(x)
                      col.mkdir(parents=True,exist_ok=True)
                      for y in range(ny):
                          with render_tile(src,x,y,nx,ny,offset,TILE) as img:
                              img.save(col/f'{y}.webp','WEBP',quality=84,method=4)
              # Pyramid levels are *derived* from the internally aligned max zoom.
              for z in range(max_z-1,-1,-1):
                  for x in range(2**(z+1)):
                      dest=tiles/str(z)/str(x)
                      dest.mkdir(parents=True,exist_ok=True)
                      for y in range(2**z):
                          with Image.new('L',(TILE*2,TILE*2)) as canvas:
                              for dx in (0,1):
                                  for dy in (0,1):
                                      with Image.open(tiles/str(z+1)/str(x*2+dx)/f'{y*2+dy}.webp') as child:
                                          canvas.paste(child,(dx*TILE,dy*TILE))
                              with canvas.resize((TILE,TILE),Image.Resampling.LANCZOS) as im:
                                  im.save(dest/f'{y}.webp','WEBP',quality=84,method=4)
              with Image.open(tiles/'0'/'0'/'0.webp') as left,Image.open(tiles/'0'/'1'/'0.webp') as right:
                  with Image.new('L',(512,256)) as prev:
                      prev.paste(left,(0,0));prev.paste(right,(256,0))
                      prev.save(root/'preview_full_venus.webp','WEBP',quality=92,method=4)
              count=sum(1 for _ in tiles.rglob('*.webp'))
              expected=sum(2**(2*z+1) for z in range(max_z+1))
              if count!=expected: raise RuntimeError(f'FAIL: tiles count {count} != {expected}')
              manifest={
                  'project':'Αφροδίτη Εωσφόρος', 'map_id':'APHRODITE_MAGELLAN_INTERNAL_H0_V2',
                  'core_id':CORE_ID,'coordinate_frame':FRAME,
                  'coordinate_domain_internal_lon_deg':[-180,180],
                  'coordinate_domain_internal_lat_deg':[-90,90],
                  'H0_reference':'transferred Temple of Aphrodite in Acrocorinth; H=0 by internal definition',
                  'omphalos_G':geometry,
                  'raster_register':{
                      'purpose':'visual overlay only',
                      'native_0E_assigned_to':'temporary transported Delphi meridian (visual chart gauge)',
                      'source_native_lon_deg_at_local_H0':offset,
                      'source_lon_formula':'source_longitude_E = (APHRODITE_internal_signed_lon + temporary_delphi_to_temple_deg) mod 360',
                      'physical_body_fixed_registration_verified':False,
                      'used_to_define_omphalos_or_EA':False,
                  },
                  'source':{'url':C3_URL,'sha256':checksum(src_path),'size_pixels':[width,height],
                            'native_longitude_deg':[-180,180], 'native_latitude_deg':[-90,90],
                            'credit':'NASA/JPL Magellan; USGS Astrogeology'},
                  'tiles':{'directory':ROOT_NAME+'/tiles','z_min':0,'z_max':max_z,
                           'z0_matrix':[2,1],'max_matrix':[2**(max_z+1),2**max_z],
                           'tile_size_px':TILE,'format':'WebP','tile_count':count},
                  'test_mode_synthetic':synthetic,
              }
              (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print(f'PASS: {count}/{expected} internally aligned tiles; H0 at internal 0°, raster rotation {offset:.12f}°')
              print('PASS: G-only source-freeze / signed map bounds / manifest')
              return manifest

          if __name__=='__main__':
              p=argparse.ArgumentParser()
              p.add_argument('src',type=Path)
              p.add_argument('--output',type=Path,default=Path(ROOT_NAME))
              p.add_argument('--max-z',type=int,default=5)
              p.add_argument('--synthetic',action='store_true')
              a=p.parse_args()
              build(a.src,a.output,a.max_z,a.synthetic)
          PY
          python /tmp/build_aphrodite_tiles.py \
            Venus_Magellan_C3-MDIR_Global_Mosaic_2025m.tif \
            --output aphrodite_ea_map --max-z 5
      - name: Verify EXACT map-to-HTML registered frame and tile count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, math
          from pathlib import Path
          root=Path('aphrodite_ea_map')
          data=json.loads((root/'manifest.json').read_text())
          assert data['coordinate_frame']=='APHRODITE_LOCAL_OMPHALOS_H0'
          assert data['coordinate_domain_internal_lon_deg']==[-180,180]
          assert data['omphalos_G']['local_omphalos_H']==0
          assert data['omphalos_G']['local_omphalos_longitude_deg']==0.0
          assert abs(data['raster_register']['source_native_lon_deg_at_local_H0']-0.3746419723351068)<2e-10
          assert data['raster_register']['used_to_define_omphalos_or_EA'] is False
          assert data['source']['size_pixels']==[18775,9388]
          assert data['tiles']['tile_count']==2730
          assert sum(1 for x in (root/'tiles').rglob('*.webp'))==2730
          assert data['tiles']['max_matrix']==[64,32]
          assert (root/'tiles/0/0/0.webp').stat().st_size>0
          assert (root/'tiles/0/1/0.webp').stat().st_size>0
          print('PASS: internal Omphalos chart / raster registration / 2730 tiles')
          PY
      - name: Commit ONLY new APHRODITE EA map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A aphrodite_ea_map
          if git diff --cached --quiet; then
            echo "Map identical; no commit needed"
          else
            git commit -m "Build APHRODITE Eosphoros Omphalos-origin EA map V2"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
